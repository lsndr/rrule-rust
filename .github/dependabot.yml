version: 2
updates:
  - package-ecosystem: 'npm'
    target-branch: 'next'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      emnapi:
        patterns:
          - 'emnapi'
          - '@emnapi/*'
  - package-ecosystem: 'cargo'
    target-branch: 'next'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      napi:
        patterns:
          - '*napi*'
  - package-ecosystem: 'github-actions'
    target-branch: 'next'
    directory: '/'
    schedule:
      interval: 'weekly'
