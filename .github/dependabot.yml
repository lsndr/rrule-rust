version: 2
updates:
  - package-ecosystem: 'npm'
    target-branch: 'next'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # v10 is incompatible with @semantic-release/release-notes-generator@14
      - dependency-name: 'conventional-changelog-conventionalcommits'
        update-types: ['version-update:semver-major']
    groups:
      emnapi:
        patterns:
          - 'emnapi'
          - '@emnapi/*'
  - package-ecosystem: 'cargo'
    target-branch: 'next'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      napi:
        patterns:
          - '*napi*'
  - package-ecosystem: 'github-actions'
    target-branch: 'next'
    directory: '/'
    schedule:
      interval: 'weekly'
